services:
  postgres-db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    container_name: store-db
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
